<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body class="" style="background-color: #EFDF68;">

    <div class="m-auto" style="width: clamp(410px, 80%, 800px);">
         <div
                class="col d-flex justify-content-center align-items-center gap-2 p-4 mb-3">
                <img style="width: 6.4rem; height: 6.4rem;" class="" src="img/favico.png" alt="">
                <div class="fs-1">Agritech App</div>
            </div>
        <form action="pages/home.html" style="background-color: #1D3D13; color: white;" class="w-100 p-4 rounded-3">
            <div class="w-100 text-center p-4 fs-3">Login</div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label py-3">Veillez entrer votre mail <span class="text-danger">*</span> </label>
                <input class="col-12 p-2 fs-5 rounded-3" placeholder="Email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required >
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label py-3">Veillez saisir votre Mot de Passe <span class="text-danger">*</span> </label>
                <input class="col-12 p-2 fs-5 rounded-3" placeholder="Password" type="password" class="form-control" id="exampleInputPassword1" required >
            </div>
            <div class="mb-3 form-check m-0">
                <input class="fs-4" type="radio" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Se souvenir de moi</label>
            </div>
            <div class="d-flex justify-content-end">
            <button type="submit" class="btn bg-success text-white px-4 py-3 rounded-5 fs-5">Login <i class="bi bi-arrow-up-right fs-5"></i></i></button>
            </div>
            <div class="fs-5 mt-4">Veillez contacter un administrateur si vous avez oublie votre mot de passe</div>
        </form>
    </div>
</body>


</html>
